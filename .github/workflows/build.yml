name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: MiniSynth-VST3-${{ matrix.os }}
          path: build/MiniSynth_artefacts/Release/VST3/*.vst3
